name: CI

on:
  push:
    branches: [ main, develop, spec/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend (.NET 9)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Pos19453055
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./backend/src/CashCaddy
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
      working-directory: ./backend/src/CashCaddy
    
    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal
      working-directory: ./backend
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Database=postgres;Username=postgres;Password=Pos19453055"

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/cash-caddy-ui/package-lock.json
    
    - name: Install dependencies
      run: npm ci
      working-directory: ./frontend/cash-caddy-ui
    
    - name: Lint
      run: npm run lint
      working-directory: ./frontend/cash-caddy-ui
    
    - name: Build
      run: npm run build
      working-directory: ./frontend/cash-caddy-ui
    
    - name: Test
      run: npm test
      working-directory: ./frontend/cash-caddy-ui

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build backend image
      run: docker build -t cashcaddy-backend:test ./backend/src/CashCaddy
    
    - name: Build frontend image
      run: docker build -t cashcaddy-frontend:test ./frontend/cash-caddy-ui
    
    - name: Test docker-compose
      run: docker compose config

  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: always()
    
    steps:
    - name: Check status
      run: |
        if [ "${{ needs.backend.result }}" == "success" ] && \
           [ "${{ needs.frontend.result }}" == "success" ] && \
           [ "${{ needs.docker.result }}" == "success" ]; then
          echo "✅ All CI checks passed!"
          exit 0
        else
          echo "❌ Some CI checks failed"
          echo "Backend: ${{ needs.backend.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Docker: ${{ needs.docker.result }}"
          exit 1
        fi
